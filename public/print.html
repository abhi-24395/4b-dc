<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Delivery Challan - Print</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1f2430;
      max-width: 800px;
      margin: 30px auto;
      padding: 0 16px;
    }
    h1 { text-align: center; letter-spacing: 2px; margin-bottom: 4px; }
    .subtitle { text-align: center; color: #6b7280; margin-top: 0; margin-bottom: 20px; }
    .header-block {
      display: flex;
      justify-content: space-between;
      border: 1px solid #333;
      padding: 12px;
      margin-bottom: 16px;
    }
    .header-block div { flex: 1; }
    .header-block .right { text-align: right; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
    th, td { border: 1px solid #333; padding: 6px 8px; font-size: 0.92rem; }
    th { background: #f0f1f3; text-align: left; }
    td.num, th.num { text-align: right; }
    .totals-row td { font-weight: bold; }
    .remarks { border: 1px solid #333; padding: 10px; margin-bottom: 24px; min-height: 40px; }
    .signatures { display: flex; justify-content: space-between; margin-top: 60px; }
    .signatures div { text-align: center; width: 200px; border-top: 1px solid #333; padding-top: 6px; }
    .print-actions { text-align: center; margin: 16px 0; }
    .print-actions button {
      padding: 8px 18px; font-size: 0.95rem; cursor: pointer;
      border-radius: 6px; border: 1px solid #333; background: white;
    }
    @media print {
      .print-actions { display: none; }
      body { margin: 0; max-width: none; }
    }
  </style>
</head>
<body>
  <div class="print-actions">
    <button onclick="window.print()">Print</button>
  </div>
  <div id="content">Loading...</div>
  <script src="print.js"></script>
</body>
</html>
