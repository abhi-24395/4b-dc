<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Delivery Challan - Print</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #000;
      max-width: 850px;
      margin: 30px auto;
      padding: 0 16px;
    }
    .challan-box {
      border: 2px solid #000;
    }
    .doc-title {
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 0.12em;
      padding: 8px 14px;
      border-bottom: 2px solid #000;
      background: #000;
      color: #fff;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .company-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #000;
      padding: 10px 14px;
    }
    .company-info {
      flex: 1;
      text-align: center;
    }
    .company-info h1 {
      font-size: 1.4rem;
      margin: 0 0 4px;
    }
    .company-info .gstin {
      font-weight: bold;
      font-size: 0.85rem;
      margin: 0 0 4px;
    }
    .company-info .address {
      font-size: 0.8rem;
      margin: 0;
    }
    .company-logo {
      width: 70px;
      height: 70px;
      object-fit: contain;
      margin-left: 12px;
    }
    .dc-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      border-bottom: 2px solid #000;
      padding: 8px 14px;
      background: #eef4ff;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .serial-badge {
      background: #2563eb;
      color: #fff;
      font-weight: bold;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      padding: 5px 14px;
      border-radius: 4px;
      white-space: nowrap;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .contact-row {
      display: flex;
      border-bottom: 2px solid #000;
      font-size: 0.85rem;
    }
    .contact-block {
      flex: 1;
      padding: 10px 14px;
    }
    .contact-block:first-child {
      border-right: 2px solid #000;
    }
    .contact-block p {
      margin: 3px 0;
    }
    table.items-table {
      width: 100%;
      border-collapse: collapse;
    }
    .items-table th, .items-table td {
      border: 1px solid #000;
      padding: 6px 8px;
      font-size: 0.88rem;
    }
    .items-table th {
      background: #f0f1f3;
      text-align: left;
    }
    .items-table td.num, .items-table th.num { text-align: right; }
    .totals-row td { font-weight: bold; }
    .signature-row {
      display: flex;
      justify-content: flex-end;
      padding: 28px 14px 16px;
    }
    .signature-block {
      text-align: center;
      width: 220px;
    }
    .signature-block .for-company {
      font-size: 0.82rem;
      margin: 0 0 8px;
    }
    .seal-box {
      width: 100px;
      height: 70px;
      margin: 0 auto 10px;
      border: 1.5px dashed #999;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: #999;
    }
    .signature-block .sign-line {
      border-top: 1px solid #000;
      margin: 0;
      padding-top: 6px;
      font-size: 0.85rem;
    }
    .print-actions { text-align: center; margin: 16px 0; }
    .print-actions button {
      padding: 8px 18px; font-size: 0.95rem; cursor: pointer;
      border-radius: 6px; border: 1px solid #333; background: white;
    }
    @media print {
      .print-actions { display: none; }
      body { margin: 0; max-width: none; }
    }
  </style>
</head>
<body>
  <div class="print-actions">
    <button onclick="window.print()">Print</button>
  </div>
  <div id="content">Loading...</div>
  <script src="print.js"></script>
</body>
</html>
